name: Test

on:
  push:
    branches: [main]
    paths-ignore: ["examples/*.ipynb", "**/*.md", "docs/**", "dev_scripts/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["examples/*.ipynb", "**/*.md", "docs/**", "dev_scripts/**"]
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [test]
        default: test
        description: Trigger test manually.
  workflow_call: # make this workflow reusable by release.yml

# Lock GITHUB_TOKEN to read-only by default. Individual jobs can opt in to
# extra scopes via their own ``permissions`` block if ever needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      # MatML stack on LAMMPS built as a shared library with its Python module, MatGL's pair_style matgl / matgl/kk
      # (Kokkos), ML-SNAP and EXTRA-FIX, linked against the image's torch (materialyzeai/matml,
      # docker/Dockerfile.matml.kokkos-cpu). It has no ML-GNNP, so the LAMMPSMDCalc tests (pair_style gnnp) skip.
      image: docker.io/materialyzeai/matml:latest-kokkos-cpu
    env:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      PMG_MAPI_KEY: ${{ secrets.PMG_MAPI_KEY }}
      # Wipe matgl/matcalc caches at pytest start so CI always exercises fresh downloads (see tests/conftest.py).
      MATCALC_TEST_CLEAR_CACHE: "1"

    steps:
      # git before checkout, so that the checkout is a git repository (setuptools-scm version, Codecov metadata).
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl git

      - uses: actions/checkout@v5

      # The constraint keeps torch at the version LAMMPS was built against.
      - name: Install dependencies
        run: |
          UV_TORCH_BACKEND=cpu uv pip install --system -c /opt/lammps/torch-constraint.txt \
            -e '.[ci]' "setuptools<82"  # setuptools<82 is required by maml (pkg_resources)

      - name: pytest
        run: pytest -n auto --dist worksteal --cov=matcalc --cov-report=xml --cov-report=term-missing tests --color=yes

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
