name: Test FP loaders

# Smoke-test loading the foundation potentials. Slow (one provider stack per job),
# so it runs only when the loaders, their tests, the provider extras or this
# workflow change, for releases (release.yml) and on demand.
on:
  push:
    branches: [main]
    paths:
      - "src/matcalc/utils.py"
      - "tests/test_utils.py"
      - "pyproject.toml"
      - ".github/workflows/test-fp-loaders.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/matcalc/utils.py"
      - "tests/test_utils.py"
      - "pyproject.toml"
      - ".github/workflows/test-fp-loaders.yml"
  workflow_dispatch:
  workflow_call: # make this workflow reusable by release.yml

permissions:
  contents: read

jobs:
  # Per-architecture smoke tests for the unified-name foundation potential
  # registry in matcalc.utils. Each job installs only its own provider stack
  # so the matrix shards stay light and a single broken provider does not
  # block the others. Note that we are testing only the more widely used models.
  # We will rely on the community to maintain the other models in the registry.
  test-fp-loaders:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: matgl
            extras: matgl
            models: '["TensorNet-MatPES-PBE-2025.2", "TensorNet-MatPES-r2SCAN-2025.2", "M3GNet-MatPES-PBE-2025.2"]'
          - name: mace
            extras: mace
            models: '["MACE-MPtrj-0a-small", "MACE-MPA-0-medium", "MACE-OMat24-ft-MatPES-PBE-0"]'
          - name: grace
            extras: grace
            models: '["GRACE-SMAX-OMat24-2L-medium"]'
          - name: sevennet
            extras: sevennet
            models: '["SevenNet-Omni"]'
          - name: orb
            extras: orb
            python: "3.12"
            models: '["ORB-OMat24-v3-conservative-inf"]'
          - name: upet
            extras: upet
            models: '["PET-OMat24-ft-MAD-r2SCAN-1.6.0-S"]'
          - name: deepmd
            extras: deepmd
            models: '["DPA4-OMat24-2026.8.5-Mini"]'
    env:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python || '3.11' }}

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ matrix.name }}
          restore-keys: hf-models-

      - name: Install matcalc + ${{ matrix.name }} provider
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.name }}" = "matgl" ]; then
            pip install -e '.[matgl]'
          else
            pip install -e '.[${{ matrix.extras }}]'
          fi

      - name: Load each canonical model
        run: |
          python - <<'PY'
          import json, os
          from matcalc import load_fp
          from ase.calculators.calculator import Calculator
          for name in json.loads(os.environ["MODELS"]):
              calc = load_fp(name)
              assert isinstance(calc, Calculator), f"{name}: got {type(calc)}"
              print(f"OK: {name} -> {type(calc).__name__}")
          PY
        env:
          MODELS: ${{ matrix.models }}
