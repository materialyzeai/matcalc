name: LAMMPS backend

# Runs tests/test_backend_lammps.py in materialyzeai/matgl:latest-kokkos-cpu (built from materialyzeai/matml,
# docker/Dockerfile.matgl.kokkos-cpu). The image ships LAMMPS as a shared library with its Python module, built with
# MatGL's pair_style matgl and matgl/kk (Kokkos OpenMP + Serial), ML-SNAP and EXTRA-FIX, and linked against the libtorch
# of the image's torch wheel, so the Python process and LAMMPS share one libtorch. The tests run twice: with the plain
# pair styles and through Kokkos (OpenMP host backend; GitHub-hosted runners have no GPU).

on:
  push:
    branches: [main]
    paths:
      - "src/matcalc/backend/**"
      - "src/matcalc/_md.py"
      - "src/matcalc/_relaxation.py"
      - "src/matcalc/config.py"
      - "tests/test_backend_lammps.py"
      - ".github/workflows/test-lammps.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/matcalc/backend/**"
      - "src/matcalc/_md.py"
      - "src/matcalc/_relaxation.py"
      - "src/matcalc/config.py"
      - "tests/test_backend_lammps.py"
      - ".github/workflows/test-lammps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lammps-matgl:
    name: LAMMPS + ML-MATGL (CPU and Kokkos/OpenMP)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: docker.io/materialyzeai/matgl:latest-kokkos-cpu

    steps:
      - uses: actions/checkout@v5

      - name: Check LAMMPS in the image
        run: |
          python - <<'PY'
          from lammps import lammps

          lmp = lammps(cmdargs=["-log", "none", "-screen", "none", "-k", "on", "t", "1", "-sf", "kk"])
          for style in ("matgl", "matgl/kk", "snap", "lj/cut"):
              assert lmp.has_style("pair", style), f"pair_style {style} missing"
          assert lmp.has_style("fix", "temp/csvr"), "fix temp/csvr (EXTRA-FIX) missing"
          print(lmp.version(), lmp.installed_packages)
          PY

      # The constraint keeps torch at the version LAMMPS was built against.
      - name: Install matcalc
        run: |
          UV_TORCH_BACKEND=cpu uv pip install --system -c /opt/lammps/torch-constraint.txt \
            -e ".[maml,matgl]" "setuptools<82" pytest
          python -c "import lammps, matgl, torch; print('matgl', matgl.__version__, 'torch', torch.__version__)"

      # MATCALC_TEST_REQUIRE_LAMMPS turns skips for a missing LAMMPS, pair style or lmp executable into failures.
      - name: Test (pair_style matgl)
        env:
          MATCALC_TEST_REQUIRE_LAMMPS: "1"
        run: pytest tests/test_backend_lammps.py -v --color=yes

      - name: Test (pair_style matgl/kk, Kokkos OpenMP)
        env:
          MATCALC_TEST_REQUIRE_LAMMPS: "1"
          MATCALC_LAMMPS_ARGS: "-k on t 2 -sf kk -pk kokkos newton on neigh half"
          OMP_NUM_THREADS: "2"
        run: pytest tests/test_backend_lammps.py -v --color=yes
